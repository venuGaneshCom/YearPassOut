<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 1px solid black;
            padding: 6px 10px;
        }
    </style>
</head>
<body>
    <table id="table">
        <tr>
            <th>1st class</th>
            <th>2nd class</th>
            <th>3rd class</th>
            <th>5th class</th>
            <th>6th class</th>
            <th>7th class</th>
            <th>8th class</th>
            <th>9th class</th>
            <th>10th class</th>
        </tr>
        <tr id="table-data"></tr>
    </table>

    <script>
        const tenthPassYear = prompt();
        console.log(tenthPassYear);

        const tableRow = document.getElementById("table-data");

        
        const years = [
            tenthPassYear - 9,
            tenthPassYear - 8,
            tenthPassYear - 7, 
            tenthPassYear - 5, 
            tenthPassYear - 4, 
            tenthPassYear - 3, 
            tenthPassYear - 2, 
            tenthPassYear - 1, 
            tenthPassYear      
        ];

        years.forEach((year) => {
            const td = document.createElement("td");
            td.textContent = year;
            tableRow.appendChild(td);
        });
    </script>
</body>
</html>
